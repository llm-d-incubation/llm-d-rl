working_dir: ./
excludes: ["/.git/"]
env_vars:
  TORCH_NCCL_AVOID_RECORD_STREAMS: "1"
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  VLLM_DISABLE_COMPILE_CACHE: "1"
  # This cluster's flashinfer/flashinfer-cubin versions are mismatched
  # (0.6.15.post1 vs 0.6.12); llm_d_rl_verl_integration imports flashinfer
  # transitively via megatron-core, which raises on the mismatch otherwise.
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  # Per-request llm-d/EPP routing evidence (llm-d arm only): each GatewayActor
  # process writes its own reqlog-<pid>.jsonl under this dir on ITS node's local
  # filesystem -- collect from every ray-head/ray-worker node and concatenate
  # (see README.md §4), or the routing evidence silently undercounts.
  VERL_REQLOG_DIR: "/tmp/reqlog"
